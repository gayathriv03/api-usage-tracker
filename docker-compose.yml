version: "3.8"

services:

  mysql:
    image: mysql:8
    container_name: api-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Password@123
      MYSQL_DATABASE: api_usage_tracker
      MYSQL_USER: api_user
      MYSQL_PASSWORD: Api@123
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  app:
    image: gayathriv03/apiusagetracker:1.0
    container_name: api-tracker
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/api_usage_tracker
      SPRING_DATASOURCE_USERNAME: api_user
      SPRING_DATASOURCE_PASSWORD: Api@123

volumes:
  mysql-data:
